name: pc-build

on:
  pull_request:
    paths:
      - "pc/**"
      - "protocol/**"
      - "config/**"
      - "schema/**"
      - ".github/workflows/pc-build.yml"
  push:
    branches: [main]
    paths:
      - "pc/**"
      - "protocol/**"
      - "config/**"
      - "schema/**"
      - ".github/workflows/pc-build.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        run: dotnet restore pc/BmsTool.sln --nologo
      - name: Build Release
        run: dotnet build pc/BmsTool.sln -c Release --no-restore --nologo -warnaserror
      - name: Protocol smoke
        run: dotnet run --project pc/tests/Bms.Protocol.Smoke/Bms.Protocol.Smoke.csproj -c Release --no-build
