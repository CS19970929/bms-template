name: quality-gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  host-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build gcc cppcheck
      - name: Run quality gate
        env:
          BMS_DOCS_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 tools/check.py
